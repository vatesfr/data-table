<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-table Demo — Vue</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      /* --color-* tokens are injected at runtime in src/main.ts, from the same source
         @vates/data-table-vanilla uses for its self-injected stylesheet. */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: var(--color-background-primary);
        color: var(--color-text-primary);
      }

      /* The library leaves the current row (currentRow) unstyled; inset so it works over React's
         inline row background too. */
      .dt__tr--current > td:first-child {
        box-shadow: inset 3px 0 0 var(--color-text-info);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
