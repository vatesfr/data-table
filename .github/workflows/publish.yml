name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs every third-party dependency, so it gets no publish rights: it hands tarballs to `publish`.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # Run the full CI suite before publishing
      - run: npx playwright install --with-deps chromium
      - run: npm run check

      # A release bumps only the packages that changed (see the `release` skill's "Version
      # pool"), so a package whose version is already on the registry is skipped rather than
      # failing `npm publish`.
      - name: Pack changed packages
        run: |
          mkdir tarballs
          for pkg in core react vue solid vanilla; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              npm pack -w "packages/$pkg" --pack-destination tarballs
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: tarballs
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # for OIDC trusted publishing and npm provenance
    steps:
      # Node 24 bundles npm >=11.5.1, which trusted publishing requires
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs

      - name: Publish
        run: |
          for tarball in *.tgz; do
            npm publish "$tarball" --provenance --access public --ignore-scripts
          done
